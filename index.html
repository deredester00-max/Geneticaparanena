<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Filtros</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .badge {
      background-color: #6b21a8;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    canvas {
      border-radius: 16px;
      max-width: 90%;
      height: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      display: none; /* Mantenemos el video oculto y mostramos solo el canvas */
    }
  </style>
</head>
<body>

  <h2>Portal de Filtros</h2>
  <div class="badge">Filtro: Escala de Grises</div>
  <br>

  <!-- Elemento de video oculto para recibir el stream de la cámara -->
  <video id="webcam" autoplay playsinline></video>
  
  <!-- Canvas visible donde procesamos todo a máxima velocidad -->
  <canvas id="outputCanvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');

    // Inicializar la cámara web
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          renderFrame(); // Iniciar ciclo de renderizado ultra rápido
        };
      } catch (err) {
        console.error("Error al acceder a la cámara:", err);
      }
    }

    function renderFrame() {
      // 1. Limpiar el canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2. Aplicar el filtro súper rápido (Nativo de GPU)
      ctx.filter = 'grayscale(100%)'; 

      // 3. Dibujar el video en el canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 4. Restaurar el filtro a 'none' para que no afecte el recuadro u otros elementos
      ctx.filter = 'none';

      // 5. Dibujar el recuadro (Box)
      drawBoundingBox();

      // 6. Solicitar el siguiente fotograma a la velocidad de actualización de la pantalla (~60fps)
      requestAnimationFrame(renderFrame);
    }

    function drawBoundingBox() {
      // Ejemplo de coordenadas (ajusta según la detección de tu modelo de IA o valores fijos)
      const x = canvas.width * 0.25;
      const y = canvas.height * 0.2;
      const width = canvas.width * 0.5;
      const height = canvas.height * 0.6;

      // Configuración del estilo del recuadro
      ctx.strokeStyle = '#00ffcc'; // Color del borde visible
      ctx.lineWidth = 4;           // Grosor del borde
      ctx.strokeRect(x, y, width, height); // Dibujar borde rectáungulo

      // Opcional: Texto sobre el recuadro
      ctx.fillStyle = '#00ffcc';
      ctx.font = '16px Arial';
      ctx.fillText('Rostro Detectado', x, y - 8);
    }

    startCamera();
  </script>
</body>
</html>
