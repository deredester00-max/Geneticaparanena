<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Filtros por Recuadro</title>
  <!-- Cargar MediaPipe Hands y Camera Utils desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    p {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 15px;
    }

    .container {
      position: relative;
      width: 90vw;
      max-width: 480px;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Ocultamos la etiqueta de video, dibujaremos todo en el Canvas */
    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
    }
  </style>
</head>
<body>

  <h1>Portal de Filtros</h1>
  <p>Forma un recuadro con las dos manos para aplicar el filtro</p>

  <div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // Función que procesa cada frame de la cámara
    function onResults(results) {
      // Ajustar dimensiones del canvas si cambian
      if (canvasElement.width !== results.image.width) {
        canvasElement.width = results.image.width;
        canvasElement.height = results.image.height;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // 1. Dibujar el video normal sin filtro en todo el canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 2. Comprobar si se detectan 2 manos en pantalla
      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        // Obtenemos la posición de las puntas de los índices (punto 8 de MediaPipe)
        const hand1 = results.multiHandLandmarks[0][8];
        const hand2 = results.multiHandLandmarks[1][8];

        // Convertir coordenadas (0.0 a 1.0) a píxeles exactos
        const x1 = hand1.x * canvasElement.width;
        const y1 = hand1.y * canvasElement.height;
        const x2 = hand2.x * canvasElement.width;
        const y2 = hand2.y * canvasElement.height;

        // Calcular los límites del recuadro dinámico
        const minX = Math.min(x1, x2);
        const minY = Math.min(y1, y2);
        const width = Math.abs(x1 - x2);
        const height = Math.abs(y1 - y2);

        // Definir el área de recorte (solo entre las 2 manos)
        canvasCtx.beginPath();
        canvasCtx.rect(minX, minY, width, height);
        canvasCtx.clip();

        // Aplicar el filtro de Invertir Colores únicamente a ese recuadro
        canvasCtx.filter = 'invert(100%)';
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      }

      canvasCtx.restore();
    }

    // Inicializar MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2, // DETECTAR 2 MANOS A LA VEZ
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Inicializar la cámara del dispositivo
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
