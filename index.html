<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Anatomía Humana 3D</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #38bdf8;
    }

    /* Cámara de video */
    #webcam {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); z-index: 1;
    }

    /* Lienzo 3D */
    #hologramCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 2;
    }

    /* BARRA LATERAL DE SISTEMAS ANATÓMICOS */
    .selector-bar {
      position: absolute; right: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(10, 15, 30, 0.85);
      padding: 12px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(10px);
      z-index: 4; max-height: 80vh; overflow-y: auto;
    }

    .select-card {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 14px; min-width: 110px;
      text-align: center; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center;
    }

    .select-card:hover, .select-card.active, .select-card.hover-gesture {
      background: rgba(56, 189, 248, 0.5);
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    .select-card .stage-num {
      font-size: 10px; color: #7dd3fc; font-weight: bold; text-transform: uppercase;
    }

    .select-card .stage-name {
      font-size: 12px; color: #fff; font-weight: 600; margin-top: 2px;
    }

    /* CUADRO INFORMATIVO INFERIOR */
    .hud-info {
      position: absolute; left: 20px; bottom: 20px;
      background: rgba(10, 15, 30, 0.85); border-left: 3px solid #38bdf8;
      padding: 10px 14px; font-size: 12px; color: #e0f2fe; z-index: 3;
      max-width: 320px; border-radius: 0 8px 8px 0; backdrop-filter: blur(8px);
    }

    /* PUNTERO VIRTUAL PARA GESTOS */
    #virtualCursor {
      position: absolute; width: 22px; height: 22px;
      border: 2px solid #00ffcc; border-radius: 50%;
      background: rgba(0, 255, 204, 0.3); pointer-events: none;
      z-index: 10; transform: translate(-50%, -50%); display: none;
    }
  </style>

  <!-- LIBRERÍAS RENDERIZADO 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- IA RECONOCIMIENTO DE MANO -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="hologramCanvas"></canvas>
  <div id="virtualCursor"></div>

  <!-- SELECTOR DE SISTEMAS ANATÓMICOS -->
  <div class="selector-bar">
    <div class="select-card active" id="card-1" onclick="loadStage(1)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Esqueleto</span>
    </div>
    <div class="select-card" id="card-2" onclick="loadStage(2)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Muscular</span>
    </div>
    <div class="select-card" id="card-3" onclick="loadStage(3)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Circulatorio</span>
    </div>
    <div class="select-card" id="card-4" onclick="loadStage(4)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Órganos</span>
    </div>
  </div>

  <div class="hud-info" id="infoBox">
    <strong>SISTEMA ESQUELÉTICO</strong><br>
    Estructura ósea completa con cráneo, caja torácica y columna vertebral.
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hologramCanvas');
    const infoBox = document.getElementById('infoBox');
    const cursor = document.getElementById('virtualCursor');

    // Inicialización de cámara
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("API MediaDevices no soportada");
        }
        const constraints = { video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        return true;
      } catch (err) {
        console.warn("Cámara no disponible. Modo 3D activo:", err);
        return false;
      }
    }

    // Configuración 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const light1 = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0xffffff, 1.2);
    light2.position.set(5, 5, 5);
    scene.add(light2);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    camera.position.set(0, 0, 4.5);

    // Materiales Anatómicos
    const boneMat = new THREE.MeshStandardMaterial({ color: 0xe5e5e5, roughness: 0.4, metalness: 0.1 });
    const muscleMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5, metalness: 0.1 });
    const veinMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.3 });
    const arteryMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 });
    const organMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });

    // Grupo desplazado a un lado para no tapar el rostro
    let currentGroup = new THREE.Group();
    currentGroup.position.set(-1.3, -0.4, 0); 
    scene.add(currentGroup);

    // 1. Modelo de Esqueleto
    function buildSkeleton() {
      const g = new THREE.Group();
      // Cráneo
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), boneMat);
      skull.position.set(0, 1.2, 0);
      skull.scale.set(1, 1.2, 1);
      g.add(skull);

      // Columna
      const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 16), boneMat);
      spine.position.set(0, 0.3, 0);
      g.add(spine);

      // Torax / Costillas
      for(let i = 0; i < 5; i++) {
        const rib = new THREE.Mesh(new THREE.TorusGeometry(0.35 - (i*0.02), 0.03, 16, 32, Math.PI * 1.5), boneMat);
        rib.rotation.x = Math.PI / 2;
        rib.position.set(0, 0.7 - (i * 0.12), 0);
        g.add(rib);
      }

      // Pelvis
      const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.3, 16), boneMat);
      pelvis.position.set(0, -0.4, 0);
      g.add(pelvis);

      return g;
    }

    // 2. Modelo Sistema Muscular
    function buildMuscular() {
      const g = buildSkeleton(); // Base
      // Músculos de Torso y Brazos
      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), muscleMat);
      chest.position.set(0, 0.55, 0.05);
      chest.scale.set(1.1, 0.7, 0.6);
      g.add(chest);

      const abs = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.6, 16), muscleMat);
      abs.position.set(0, 0.05, 0.05);
      g.add(abs);

      return g;
    }

    // 3. Modelo Sistema Circulatorio
    function buildCirculatory() {
      const g = new THREE.Group();
      // Corazón
      const heart = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), arteryMat);
      heart.position.set(0.05, 0.55, 0.1);
      g.add(heart);

      // Red vascular primaria
      const mainArtery = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 1.4, 16), arteryMat);
      mainArtery.position.set(-0.03, 0.3, 0);
      g.add(mainArtery);

      const mainVein = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 1.4, 16), veinMat);
      mainVein.position.set(0.03, 0.3, 0);
      g.add(mainVein);

      return g;
    }

    // 4. Modelo Órganos Internos
    function buildOrgans() {
      const g = new THREE.Group();
      // Pulmones
      const lungL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), organMat);
      lungL.position.set(-0.2, 0.6, 0);
      lungL.scale.set(0.8, 1.4, 0.8);
      g.add(lungL);

      const lungR = lungL.clone();
      lungR.position.set(0.2, 0.6, 0);
      g.add(lungR);

      // Estómago e Intestinos
      const stomach = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), organMat);
      stomach.position.set(0, 0.1, 0);
      stomach.scale.set(1.2, 0.9, 1);
      g.add(stomach);

      return g;
    }

    let activeModel = buildSkeleton();
    currentGroup.add(activeModel);

    // Cambiar de vista anatómica
    window.loadStage = function(stage) {
      document.querySelectorAll('.select-card').forEach(c => c.classList.remove('active'));
      const card = document.getElementById(`card-${stage}`);
      if(card) card.classList.add('active');

      currentGroup.remove(activeModel);

      if (stage === 1) {
        activeModel = buildSkeleton();
        infoBox.innerHTML = "<strong>SISTEMA ESQUELÉTICO</strong><br>Estructura ósea completa con cráneo, caja torácica y columna vertebral.";
      } else if (stage === 2) {
        activeModel = buildMuscular();
        infoBox.innerHTML = "<strong>SISTEMA MUSCULAR</strong><br>Estructura muscular superficial y grupos de fuerza torso/extremidades.";
      } else if (stage === 3) {
        activeModel = buildCirculatory();
        infoBox.innerHTML = "<strong>SISTEMA CIRCULATORIO</strong><br>Red de arterias (rojo) y venas (azul) asociadas al núcleo cardíaco.";
      } else if (stage === 4) {
        activeModel = buildOrgans();
        infoBox.innerHTML = "<strong>ÓRGANOS INTERNOS</strong><br>Visualización de cavidad torácica y abdominal (pulmones y sistema digestivo).";
      }

      currentGroup.add(activeModel);
    };

    // Control por gestos interactivos
    async function startGestureDetection() {
      const cameraOk = await initCamera();
      if (!cameraOk) return;

      try {
        let isPinching = false;
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5 });
        hands.onResults((results) => {
          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];

            const indexX = (1 - lm[8].x) * window.innerWidth;
            const indexY = lm[8].y * window.innerHeight;
            const thumbX = (1 - lm[4].x) * window.innerWidth;
            const thumbY = lm[4].y * window.innerHeight;

            cursor.style.display = 'block';
            cursor.style.left = `${indexX}px`;
            cursor.style.top = `${indexY}px`;

            const dist = Math.hypot(indexX - thumbX, indexY - thumbY);

            document.querySelectorAll('.select-card').forEach(card => {
              const rect = card.getBoundingClientRect();
              if (indexX >= rect.left && indexX <= rect.right && indexY >= rect.top && indexY <= rect.bottom) {
                card.classList.add('hover-gesture');
                if (dist < 35 && !isPinching) {
                  isPinching = true;
                  card.click();
                }
              } else {
                card.classList.remove('hover-gesture');
              }
            });

            if (dist >= 35) isPinching = false;
          } else {
            cursor.style.display = 'none';
          }
        });

        const camUtils = new Camera(video, {
          onFrame: async () => { 
            try {
              await hands.send({ image: video }); 
            } catch (e) {
              console.warn("Error puntual en frame:", e);
            }
          },
          width: 640, height: 480
        });
        camUtils.start();
      } catch (err) {
        console.warn("Error en la inicialización de IA gestual:", err);
      }
    }

    startGestureDetection();

    // Bucle de renderizado
    function animate() {
      requestAnimationFrame(animate);
      if (currentGroup) {
        currentGroup.rotation.y += 0.008;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionamiento
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
