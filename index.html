<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Anatomía 3D Realista</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #38bdf8;
    }

    /* Cámara de video */
    #webcam {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); z-index: 1;
    }

    /* Canvas 3D */
    #hologramCanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 2;
    }

    /* BARRA LATERAL DE DERECHA PARA SELECCIÓN */
    .selector-bar {
      position: absolute; right: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(10, 15, 30, 0.85);
      padding: 12px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(10px);
      z-index: 4; max-height: 80vh; overflow-y: auto;
    }

    .select-card {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 10px 14px; min-width: 110px;
      text-align: center; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center;
    }

    .select-card:hover, .select-card.active, .select-card.hover-gesture {
      background: rgba(56, 189, 248, 0.5);
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    .select-card .stage-num {
      font-size: 10px; color: #7dd3fc; font-weight: bold; text-transform: uppercase;
    }

    .select-card .stage-name {
      font-size: 12px; color: #fff; font-weight: 600; margin-top: 2px;
    }

    /* INDICADOR DE CARGA */
    #loadingIndicator {
      position: absolute; left: 20px; top: 20px;
      background: rgba(0,0,0,0.7); padding: 8px 14px;
      border-radius: 8px; font-size: 12px; color: #00ffcc;
      z-index: 5; display: none; border: 1px solid #00ffcc;
    }

    /* CUADRO INFORMATIVO INFERIOR */
    .hud-info {
      position: absolute; left: 20px; bottom: 20px;
      background: rgba(10, 15, 30, 0.85); border-left: 3px solid #38bdf8;
      padding: 10px 14px; font-size: 12px; color: #e0f2fe; z-index: 3;
      max-width: 320px; border-radius: 0 8px 8px 0; backdrop-filter: blur(8px);
    }

    /* PUNTERO VIRTUAL PARA GESTOS */
    #virtualCursor {
      position: absolute; width: 22px; height: 22px;
      border: 2px solid #00ffcc; border-radius: 50%;
      background: rgba(0, 255, 204, 0.3); pointer-events: none;
      z-index: 10; transform: translate(-50%, -50%); display: none;
    }
  </style>

  <!-- LIBRERÍAS DE THREE.JS Y GLTFLOADER DE ALTA DEFINICIÓN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- IA RECONOCIMIENTO DE MANO (MEDIAPIPE) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="hologramCanvas"></canvas>
  <div id="loadingIndicator">Cargando modelo 3D...</div>
  <div id="virtualCursor"></div>

  <!-- SELECTOR DE SISTEMAS ANATÓMICOS (MENU LATERAL) -->
  <div class="selector-bar">
    <div class="select-card active" id="card-1" onclick="loadStage(1)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Esqueleto</span>
    </div>
    <div class="select-card" id="card-2" onclick="loadStage(2)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Muscular</span>
    </div>
    <div class="select-card" id="card-3" onclick="loadStage(3)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Circulatorio</span>
    </div>
    <div class="select-card" id="card-4" onclick="loadStage(4)">
      <span class="stage-num">Sistema</span>
      <span class="stage-name">Órganos</span>
    </div>
  </div>

  <div class="hud-info" id="infoBox">
    <strong>SISTEMA ESQUELÉTICO</strong><br>
    Cargando modelo fotorealista HD...
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hologramCanvas');
    const infoBox = document.getElementById('infoBox');
    const cursor = document.getElementById('virtualCursor');
    const loadingUI = document.getElementById('loadingIndicator');

    // Inicializar Cámara
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("API MediaDevices no disponible");
        }
        const constraints = { video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        return true;
      } catch (err) {
        console.warn("Cámara no disponible, continuando en 3D:", err);
        return false;
      }
    }

    // Configuración de la Escena 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Iluminación Profesional para Modelos 3D Complejos
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.8);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    camera.position.set(0, 0, 3.5);

    // Contenedor 3D y Cargador GLTF
    const gltfLoader = new THREE.GLTFLoader();
    let currentGroup = new THREE.Group();
    
    // DESPLAZAMIENTO A UN LADO (Para no tapar el rostro)
    currentGroup.position.set(-1.2, -0.6, 0);
    scene.add(currentGroup);

    let activeModel = null;

    // RUTAS DE MODELOS 3D (.GLB REALES)
    // Puedes colocar aquí los nombres o URLs de tus archivos .glb descargados
    const modelsList = {
      1: {
        url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BrainStem/glTF-Binary/BrainStem.glb', 
        scale: 1.0,
        text: "<strong>SISTEMA ESQUELÉTICO / NERVIOSO</strong><br>Estructura anatómica HD detallada."
      },
      2: {
        url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb', 
        scale: 8.0,
        text: "<strong>SISTEMA MUSCULAR</strong><br>Vista detallada de tejdos y densidades."
      },
      3: {
        url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BrainStem/glTF-Binary/BrainStem.glb', 
        scale: 1.0,
        text: "<strong>SISTEMA CIRCULATORIO</strong><br>Estructura principal vascularizada."
      },
      4: {
        url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BrainStem/glTF-Binary/BrainStem.glb', 
        scale: 1.0,
        text: "<strong>ÓRGANOS INTERNOS</strong><br>Representación en espacio holográfico."
      }
    };

    // Función para Cargar el Archivo 3D
    function loadGLTFModel(stage) {
      loadingUI.style.display = 'block';
      const config = modelsList[stage];

      gltfLoader.load(
        config.url,
        (gltf) => {
          if (activeModel) currentGroup.remove(activeModel);
          
          activeModel = gltf.scene;
          activeModel.scale.set(config.scale, config.scale, config.scale);
          
          currentGroup.add(activeModel);
          infoBox.innerHTML = config.text;
          loadingUI.style.display = 'none';
        },
        (xhr) => {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          if(!isNaN(percent)) loadingUI.innerText = `Cargando 3D: ${percent}%`;
        },
        (error) => {
          console.error("Error al cargar modelo .glb:", error);
          loadingUI.innerText = "Error cargando archivo 3D";
        }
      );
    }

    // Cambiar de vista desde los botones
    window.loadStage = function(stage) {
      document.querySelectorAll('.select-card').forEach(c => c.classList.remove('active'));
      const card = document.getElementById(`card-${stage}`);
      if(card) card.classList.add('active');

      loadGLTFModel(stage);
    };

    // Carga inicial del primer sistema anatómico
    loadGLTFModel(1);

    // Detección Gestual MediaPipe
    async function startGestureDetection() {
      const cameraOk = await initCamera();
      if (!cameraOk) return;

      try {
        let isPinching = false;
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5 });
        hands.onResults((results) => {
          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];

            const indexX = (1 - lm[8].x) * window.innerWidth;
            const indexY = lm[8].y * window.innerHeight;
            const thumbX = (1 - lm[4].x) * window.innerWidth;
            const thumbY = lm[4].y * window.innerHeight;

            cursor.style.display = 'block';
            cursor.style.left = `${indexX}px`;
            cursor.style.top = `${indexY}px`;

            const dist = Math.hypot(indexX - thumbX, indexY - thumbY);

            document.querySelectorAll('.select-card').forEach(card => {
              const rect = card.getBoundingClientRect();
              if (indexX >= rect.left && indexX <= rect.right && indexY >= rect.top && indexY <= rect.bottom) {
                card.classList.add('hover-gesture');
                if (dist < 35 && !isPinching) {
                  isPinching = true;
                  card.click();
                }
              } else {
                card.classList.remove('hover-gesture');
              }
            });

            if (dist >= 35) isPinching = false;
          } else {
            cursor.style.display = 'none';
          }
        });

        const camUtils = new Camera(video, {
          onFrame: async () => { 
            try {
              await hands.send({ image: video }); 
            } catch (e) {
              console.warn("Manejo de frame:", e);
            }
          },
          width: 640, height: 480
        });
        camUtils.start();
      } catch (err) {
        console.warn("IA gestual no inicializada:", err);
      }
    }

    startGestureDetection();

    // Bucle de Animación
    function animate() {
      requestAnimationFrame(animate);
      if (currentGroup) {
        currentGroup.rotation.y += 0.005; // Rotación sutil del modelo
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Ajuste al redimensionar ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
