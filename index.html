<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Filtros Interactivo</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
    }

    .controls {
      margin-bottom: 15px;
    }

    select, button {
      padding: 8px 16px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Ocultamos el video original y dibujamos todo en el Canvas */
    #input_video {
      display: none;
    }

    #output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Efecto espejo */
    }
  </style>

  <!-- Librerías de MediaPipe para detección de manos -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Portal de Filtros con Seguimiento de Manos</h1>

  <div class="controls">
    <label for="filterSelect">Elige un filtro/efecto: </label>
    <select id="filterSelect">
      <option value="purple_polygon">Polígono Morado (Portal)</option>
      <option value="blur_inside">Desenfoque / Blur</option>
      <option value="sepia_inside">Tono Sepia</option>
      <option value="invert_inside">Invertir Colores</option>
    </select>
  </div>

  <div class="container">
    <video id="input_video" width="640" height="480" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const filterSelect = document.getElementById('filterSelect');

    let handPoints = [];

    // Configuración de MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    function onResults(results) {
      // Dibujar la imagen de la cámara en el canvas
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      handPoints = [];

      // Detectar las posiciones de las manos (usamos la punta del dedo índice de cada mano)
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          // El punto 8 corresponde a la punta del dedo índice
          const indexTip = landmarks[8];
          handPoints.push({
            x: indexTip.x * canvasElement.width,
            y: indexTip.y * canvasElement.height
          });
        }
      }

      // Si detectamos al menos 2 dedos/puntos, creamos la región o portal
      if (handPoints.length >= 2) {
        applyHandFilter(handPoints, filterSelect.value);
      }

      canvasCtx.restore();
    }

    function applyHandFilter(points, filterType) {
      const p1 = points[0];
      const p2 = points[1];

      // Definimos la forma del portal/polígono según las manos
      canvasCtx.beginPath();
      canvasCtx.moveTo(p1.x, p1.y - 50);
      canvasCtx.lineTo(p2.x, p2.y - 50);
      canvasCtx.lineTo(p2.x, p2.y + 50);
      canvasCtx.lineTo(p1.x, p1.y + 50);
      canvasCtx.closePath();

      // Aplicar estilos/filtros dentro de la forma seleccionada
      if (filterType === 'purple_polygon') {
        canvasCtx.fillStyle = 'rgba(128, 0, 128, 0.65)'; // Color púrpura semitransparente
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#d8b4fe';
        canvasCtx.lineWidth = 4;
        canvasCtx.stroke();
      } else {
        // Para filtros avanzados (blur, sepia, invert) usamos el modo de recorte
        canvasCtx.save();
        canvasCtx.clip();

        if (filterType === 'blur_inside') {
          canvasCtx.filter = 'blur(10px)';
        } else if (filterType === 'sepia_inside') {
          canvasCtx.filter = 'sepia(100%)';
        } else if (filterType === 'invert_inside') {
          canvasCtx.filter = 'invert(100%)';
        }

        // Redibujar la sección recortada con el filtro activo
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();
      }
    }

    // Inicializar la cámara
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
