<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Holograma Embriológico Star Wars</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: 'Segoe UI', Roboto, monospace;
      color: #38bdf8;
    }

    /* Video de la cámara de fondo */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
      z-index: 1;
      filter: brightness(0.7) contrast(1.2);
    }

    /* Canvas 3D para el holograma */
    #hologramCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Capa de efecto cibernético de la pantalla */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Panel de Control Flotante Estilo Star Wars (HUD) */
    .hud-panel {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #0284c7;
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(2, 132, 199, 0.2);
      z-index: 4;
    }

    .hud-header {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7dd3fc;
      border-bottom: 1px solid rgba(56, 189, 248, 0.4);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-header::after {
      content: '● REC';
      color: #ef4444;
      font-size: 10px;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .hud-btn {
      width: 100%;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid #38bdf8;
      color: #e0f2fe;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hud-btn:hover, .hud-btn.active {
      background: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      border-color: #7dd3fc;
      transform: translateX(-4px);
    }

    .hud-info {
      position: absolute;
      left: 20px;
      bottom: 20px;
      background: rgba(15, 23, 42, 0.7);
      border-left: 3px solid #38bdf8;
      padding: 10px 15px;
      font-size: 12px;
      z-index: 4;
      max-width: 300px;
      border-radius: 0 8px 8px 0;
    }

    /* Adaptación a celulares */
    @media (max-width: 768px) {
      .hud-panel {
        right: 10px;
        top: auto;
        bottom: 10px;
        transform: none;
        width: calc(100% - 20px);
      }
      .hud-info { display: none; }
    }
  </style>

  <!-- Motores 3D Ultra Rápidos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Cámara de Fondo -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Lienzo Holográfico -->
  <canvas id="hologramCanvas"></canvas>

  <!-- Textura cibernética -->
  <div class="scanlines"></div>

  <!-- Panel de Control Holográfico (Derecha) -->
  <div class="hud-panel">
    <div class="hud-header">EMBRIOLOGÍA HOLOGRÁFICA</div>
    <button class="hud-btn active" onclick="loadStage(1, this)">
      1. Célula Zigoto <span>01 DIA</span>
    </button>
    <button class="hud-btn" onclick="loadStage(2, this)">
      2. Mórula <span>04 DÍAS</span>
    </button>
    <button class="hud-btn" onclick="loadStage(3, this)">
      3. Blastocisto <span>07 DÍAS</span>
    </button>
    <button class="hud-btn" onclick="loadStage(4, this)">
      4. Embrión Humano <span>06 SEMANAS</span>
    </button>
  </div>

  <!-- Información flotante (Izquierda) -->
  <div class="hud-info" id="infoBox">
    <strong>ETAPA 1: ZIGOTO</strong><br>
    Fusión del material genético. Inicia la segmentación celular activa.
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hologramCanvas');
    const infoBox = document.getElementById('infoBox');

    // 1. Activar Cámara
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("No se pudo acceder a la cámara:", err);
      }
    }
    initCamera();

    // 2. Configurar Three.js para Holograma 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    camera.position.set(-1.2, 0, 3.5); // Posición desplazada para ver el rostro a la izquierda

    // Material de Holograma azul neón estilo Star Wars
    const holoMaterial = new THREE.MeshBasicMaterial({
      color: 0x00f3ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });

    // Crear grupo para el modelo activo
    let hologramGroup = new THREE.Group();
    scene.add(hologramGroup);

    // Luces
    const light = new THREE.PointLight(0x00f3ff, 2, 100);
    light.position.set(2, 2, 2);
    scene.add(light);

    // 3. Generar Modelos Embriológicos en 3D
    function createZygote() {
      const group = new THREE.Group();
      const geo = new THREE.SphereGeometry(1, 32, 32);
      const mesh = new THREE.Mesh(geo, holoMaterial);
      group.add(mesh);
      return group;
    }

    function createMorula() {
      const group = new THREE.Group();
      for (let i = 0; i < 16; i++) {
        const geo = new THREE.SphereGeometry(0.35, 16, 16);
        const mesh = new THREE.Mesh(geo, holoMaterial);
        mesh.position.set(
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 1.2
        );
        group.add(mesh);
      }
      return group;
    }

    function createBlastocyst() {
      const group = new THREE.Group();
      // Capa externa
      const outerGeo = new THREE.SphereGeometry(1.1, 24, 24);
      const outerMesh = new THREE.Mesh(outerGeo, new THREE.MeshBasicMaterial({ color: 0x0088ff, wireframe: true, transparent: true, opacity: 0.3 }));
      group.add(outerMesh);

      // Masa celular interna
      const innerGeo = new THREE.SphereGeometry(0.5, 16, 16);
      const innerMesh = new THREE.Mesh(innerGeo, holoMaterial);
      innerMesh.position.set(-0.4, 0.2, 0);
      group.add(innerMesh);

      return group;
    }

    function createEmbryo() {
      const group = new THREE.Group();
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.8, 0),
        new THREE.Vector3(-0.4, 0.4, 0),
        new THREE.Vector3(-0.2, -0.3, 0),
        new THREE.Vector3(0.3, -0.7, 0)
      ]);
      const geo = new THREE.TubeGeometry(curve, 32, 0.25, 12, false);
      const mesh = new THREE.Mesh(geo, holoMaterial);
      group.add(mesh);

      // Cabeza del embrión
      const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
      const headMesh = new THREE.Mesh(headGeo, holoMaterial);
      headMesh.position.set(0, 0.8, 0);
      group.add(headMesh);

      return group;
    }

    // Cargar modelo inicial
    let currentModel = createZygote();
    hologramGroup.add(currentModel);

    // 4. Lógica para cambiar etapas embriológicas
    window.loadStage = function(stage, btn) {
      document.querySelectorAll('.hud-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      hologramGroup.remove(currentModel);

      if (stage === 1) {
        currentModel = createZygote();
        infoBox.innerHTML = "<strong>ETAPA 1: ZIGOTO</strong><br>Fusión del material genético. Inicia la segmentación celular activa.";
      } else if (stage === 2) {
        currentModel = createMorula();
        infoBox.innerHTML = "<strong>ETAPA 2: MÓRULA</strong><br>Masa compacta de 12 a 16 células semejante a una mora.";
      } else if (stage === 3) {
        currentModel = createBlastocyst();
        infoBox.innerHTML = "<strong>ETAPA 3: BLASTOCISTO</strong><br>Formación de cavidad llena de líquido y masa celular interna.";
      } else if (stage === 4) {
        currentModel = createEmbryo();
        infoBox.innerHTML = "<strong>ETAPA 4: EMBRIÓN (6 SEMANAS)</strong><br>Desarrollo inicial del tubo neural, extremidades y arcos faríngeos.";
      }

      hologramGroup.add(currentModel);
    };

    // 5. Bucle de animación fluida a 60 FPS
    function animate() {
      requestAnimationFrame(animate);

      // Rotación constante estilo proyección holográfica
      if (hologramGroup) {
        hologramGroup.rotation.y += 0.01;
        hologramGroup.rotation.x += 0.003;
      }

      renderer.render(scene, camera);
    }
    animate();

    // Reajuste de pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
