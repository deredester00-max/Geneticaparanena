<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz para mi Amor Bonito 💖</title>
    <style>
        :root {
            --bg-color: #fce7f3;
            --card-bg: #ffffff;
            --text-color: #831843;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --correct-color: #10b981;
            --incorrect-color: #f43f5e;
            --border-color: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#f472b6 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 3px solid #f9a8d4;
            border-radius: 24px;
            max-width: 650px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 15px 30px rgba(236, 72, 153, 0.2);
            text-align: center;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 2px dashed #fbcfe8;
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .progress {
            font-size: 0.95rem;
            color: #be185d;
            font-weight: bold;
        }

        .question-container {
            background-color: #fff1f2;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #fecdd3;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            color: #9f1239;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: #fff;
            border: 2px solid #fbcfe8;
            color: #831843;
            padding: 14px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--accent-color);
            background-color: #fdf2f8;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            border-color: var(--correct-color);
            background-color: #d1fae5;
            color: #065f46;
        }

        .btn-option.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffe4e6;
            color: #9f1239;
        }

        .feedback-card {
            display: none;
            padding: 16px;
            border-radius: 16px;
            background-color: #fdf2f8;
            border: 2px solid #fbcfe8;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #831843;
        }

        .reaction-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4);
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .result-screen {
            display: none;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .result-screen p {
            font-size: 1.2rem;
            color: #9f1239;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💖 Repaso para mi Amor Bonito 🌸</h1>
            <div id="progress" class="progress">Pregunta 1 de 30</div>
        </header>

        <main id="quiz-screen">
            <div class="question-container">
                <div id="question" class="question-text">Cargando la pregunta para mi reina...</div>
            </div>
            <div id="options" class="options-grid"></div>
            <div id="feedback" class="feedback-card">
                <div id="reaction-title" class="reaction-header"></div>
                <div id="explanation-body"></div>
            </div>
            <button id="next-btn" class="action-btn" style="display: none;">Siguiente Preguntita 💕</button>
        </main>

        <section id="result-screen" class="result-screen">
            <h2>¡Lo lograste mi vida! 🎉💖</h2>
            <p id="score-text"></p>
            <button onclick="restartQuiz()" class="action-btn">Repetir para mi niño consentido 🔄</button>
        </section>
    </div>

    <script>
        // Mensajes cariñosos y divertidos
        const correctReactions = [
            "¡Eso mi amor bonito! Te la sabes todita 😍✨",
            "¡Uff qué inteligente es mi reina carajo! 🧠💖",
            "¡Anotaste mi vida! Así me gusta ver a mi niña preciosa 🌸",
            "¡Eso ombe, si tú eres una dura en esto! 👑💕",
            "¡Exacto mi cielo! Cada día me enamoras más 💖"
        ];

        const incorrectReactions = [
            "¡Uy cómo cree marica esa no es! 🤣 Te me despistaste mi amor bonito",
            "¡Qué le pasa ombe! Si no responde bien esta la que sigue le mamaré esa pepa 😈🔥",
            "¡Epa mi cielo esa no era! Concéntrese mi niña hermosa 💕",
            "¡Ay mi vida te me confundiste! Pero te sigo amando igualito 💖",
            "¡No no no mi reina! Revisa bien pues, ponte atenta mi amor 🌸"
        ];

        const questions = [
            {
                question: "¿Qué porcentaje aproximado de similitud genómica comparten todos los seres humanos entre sí?",
                options: ["80%", "90%", "Más del 99%", "50%"],
                correct: 2,
                explanation: "Todos los seres humanos compartimos más del 99% del genoma debido al cuello de botella poblacional ocurrido hace ~200,000 años en África."
            },
            {
                question: "¿Cuál es el porcentaje aproximado de homología genómica entre el ser humano y el chimpancé?",
                options: ["98%", "85%", "99.9%", "70%"],
                correct: 0,
                explanation: "Compartimos aproximadamente un 98% de homología genómica con el chimpancé, teniendo un ancestro común hace unos 6 millones de años."
            },
            {
                question: "¿Qué porcentaje del genoma humano corresponde al exoma (ADN codificante de proteínas)?",
                options: ["10%", "23%", "4%", "~1.6%"],
                correct: 3,
                explanation: "Solo alrededor del 1.6% del genoma equivale al exoma (exones), el cual codifica directamente para las proteínas."
            },
            {
                question: "¿De cuántos pares de bases (pb) consta la secuencia consenso repetida en el ADN centromérico humano?",
                options: ["100 pb", "171 pb", "2.4 pb", "1,000 pb"],
                correct: 1,
                explanation: "El ADN centromérico está compuesto por repeticiones en tándem de 171 pares de bases, vitales para la división celular."
            },
            {
                question: "¿Qué nombre recibe el hipotético último ancestro común universal de toda la vida en la Tierra?",
                options: ["HOMOLOG", "CENTRO", "LUCA", "BOTTLE"],
                correct: 2,
                explanation: "LUCA (Last Universal Common Ancestor) fue el ancestro común de toda la vida terrestre."
            },
            {
                question: "¿Qué especie comparte aproximadamente un 85% de similitud genómica en secuencias codificantes con nosotros?",
                options: ["Ratón (Mus musculus)", "Plátano", "Mosca de la fruta", "Bacterias"],
                correct: 0,
                explanation: "El ratón comparte alrededor del 85% de sus genes codificantes, siendo clave para estudios médicos."
            },
            {
                question: "¿Qué porcentaje aproximado de similitud genómica compartimos con la mosca de la fruta?",
                options: ["10%", "30%", "60%", "90%"],
                correct: 2,
                explanation: "Compartimos cerca del 60% de los genes con la mosca de la fruta para funciones biológicas básicas."
            },
            {
                question: "¿Qué fenómeno evolutivo explica la reducida diversidad genética entre la población humana actual?",
                options: ["Cuello de botella poblacional", "Deriva génica acelerada", "Especiación simpátrica", "Mutación dirigida"],
                correct: 0,
                explanation: "Un cuello de botella drástico redujo drásticamente a la población ancestral en África."
            },
            {
                question: "¿Qué constituyen la mayor parte del genoma humano no codificante (aproximadamente el 45-50%)?",
                options: ["Genes ribosomales", "Elementos transponibles (transposones)", "Promotores básicos", "Exones primarios"],
                correct: 1,
                explanation: "Los transposones o elementos móviles representan casi la mitad de nuestro ADN."
            },
            {
                question: "¿Cómo se llama al conjunto de regiones no codificantes que son removidas durante el Splicing?",
                options: ["Exones", "Intrones", "Cromómeros", "Centrómeros"],
                correct: 1,
                explanation: "Los intrones se eliminan para que los exones se unan y formen el ARNm maduro."
            },
            {
                question: "¿Qué representa la similitud genómica del 50% con plantas como el plátano?",
                options: ["Proteínas estructurales idénticas", "Vías metabólicas y celulares básicas de eucariotas", "Sistemas vasculares", "Paredes celulares"],
                correct: 1,
                explanation: "Refleja funciones celulares universales que compartimos desde los primeros eucariotas."
            },
            {
                question: "¿Qué variación de una sola base nitrogenada es la fuente más abundante de diferencias entre dos personas?",
                options: ["CNVs", "SNPs (Polimorfismos de nucleótido único)", "Inversiones", "Translocaciones"],
                correct: 1,
                explanation: "Los SNPs representan los cambios nucleótido a nucleótido que nos hacen únicos."
            },
            {
                question: "¿Qué estructura cromosómica garantiza la segregación equitativa del ADN en la división celular?",
                options: ["Telómero", "Centrómero", "Intrón", "Origen de replicación"],
                correct: 1,
                explanation: "El centrómero une las cromátidas y permite el agarre del huso acromático."
            },
            {
                question: "¿Cuál es la función principal de los telómeros?",
                options: ["Codificar enzimas", "Proteger contra la degradación y acortamiento del ADN", "Unir cromosomas", "Sintetizar ribosomas"],
                correct: 1,
                explanation: "Protegen las puntas del cromosoma para no perder información vital."
            },
            {
                question: "¿Cuántos genes codificantes de proteínas se estima que tenemos en el genoma humano?",
                options: ["100,000 - 150,000", "20,000 - 25,000", "5,000 - 10,000", "1,000,000"],
                correct: 1,
                explanation: "Tenemos solo entre 20,000 y 25,000 genes codificantes."
            },
            {
                question: "¿Qué tipo de ARN lleva la información del ADN a los ribosomas?",
                options: ["ARNm (mensajero)", "ARNt", "ARNr", "ARNsn"],
                correct: 0,
                explanation: "El ARNm lleva el mensaje del núcleo al citoplasma."
            },
            {
                question: "¿Cómo se le llama a las secuencias altamente repetidas puestas una al lado de la otra?",
                options: ["Repeticiones en tándem", "Retrotransposones", "Exones alternativos", "Pseudo-genes"],
                correct: 0,
                explanation: "Las repeticiones en tándem están pegaditas una tras otra en el ADN."
            },
            {
                question: "¿Qué enzima sintetiza la nueva cadena de ADN en la replicación?",
                options: ["ARN Polimerasa", "ADN Polimerasa", "Helicasa", "Ligasa"],
                correct: 1,
                explanation: "La ADN Polimerasa se encarga de ir copiando la hebra de ADN."
            },
            {
                question: "¿Qué proceso permite obtener varias proteínas distintas a partir de un mismo gen?",
                options: ["Splicing alternativo", "Mutación puntual", "Replicación", "Traducción"],
                correct: 0,
                explanation: "El Splicing alternativo combina exones de formas distintas para crear varias proteínas."
            },
            {
                question: "¿Qué porcentaje del genoma humano corresponde a secuencias únicas (no repetitivas)?",
                options: ["10%", "Cerca del 50%", "99%", "0.5%"],
                correct: 1,
                explanation: "Aproximadamente el 50% de nuestro genoma son secuencias únicas."
            },
            {
                question: "¿Qué enzima evita el acortamiento de las puntas cromosómicas en células germinales?",
                options: ["Telomerasa", "Topoisomerasa", "Primasa", "Cinetocoras"],
                correct: 0,
                explanation: "La telomerasa alarga y mantiene protegidos los telómeros."
            },
            {
                question: "¿Cómo se llama la variación estructural donde se ganan o pierden trozos grandes de ADN?",
                options: ["CNV (Variación en número de copias)", "SNV", "Polimorfismo silencioso", "Transición"],
                correct: 0,
                explanation: "Las CNVs son duplicaciones o deleciones de más de 1,000 bases."
            },
            {
                question: "¿Cómo se le llama al proceso de síntesis de proteínas a partir del ARNm?",
                options: ["Transcripción", "Traducción", "Splicing", "Replicación"],
                correct: 1,
                explanation: "La traducción lee el código del ARNm para construir la proteína."
            },
            {
                question: "¿De quién heredamos el ADN mitocondrial prácticamente en un 100%?",
                options: ["Del papá", "De la mamá", "De ambos por igual", "De los abuelos patenor"],
                correct: 1,
                explanation: "El ADNmt es 100% de herencia materna a través del óvulo."
            },
            {
                question: "¿Qué transposones se mueven usando un molde de ARN intermediario?",
                options: ["Retrotransposones", "Transposones de ADN", "Plásmidos", "Bacteriófagos"],
                correct: 0,
                explanation: "Los retrotransposones se copian a ARN y luego de vuelta a ADN para moverse."
            },
            {
                question: "¿Qué elementos repetidos representan casi el 10% de todo nuestro genoma?",
                options: ["Elementos Alu", "LINE-1", "HERV", "Microsatélites"],
                correct: 0,
                explanation: "Los elementos Alu son cortitos y súper abundantes en el genoma humano."
            },
            {
                question: "¿Cómo se llama la cromatina súper compactada e inactiva?",
                options: ["Eucromatina", "Heterocromatina", "Nucleosoma", "Promotor"],
                correct: 1,
                explanation: "La heterocromatina está muy apretada y casi no se transcribe."
            },
            {
                question: "¿Cuál es la unidad básica de empaquetamiento del ADN formada por 8 histonas?",
                options: ["Nucleosoma", "Centrómero", "Cinetocoro", "Polimerasa"],
                correct: 0,
                explanation: "El nucleosoma es la 'bolita' sobre la que se enrolla el ADN."
            },
            {
                question: "¿Qué prueba analiza solamente el 1.6% codificante del ADN para buscar enfermedades?",
                options: ["Secuenciación del Exoma Completo (WES)", "WGS", "Kariotipo", "PCR"],
                correct: 0,
                explanation: "WES busca directo en el exoma para ver si hay mutaciones en proteínas."
            },
            {
                question: "¿Qué herramienta evolutiva usa la tasa de mutación constante para medir tiempo entre especies?",
                options: ["Reloj Molecular", "Selección Natural", "Splicing", "Apareamiento"],
                correct: 0,
                explanation: "El reloj molecular calcula cuándo se separaron dos especies evolutivamente."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const reactionTitle = document.getElementById('reaction-title');
        const explanationBody = document.getElementById('explanation-body');
        const nextBtn = document.getElementById('next-btn');
        const progressEl = document.getElementById('progress');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const scoreText = document.getElementById('score-text');

        function loadQuestion() {
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            optionsEl.innerHTML = '';

            const q = questions[currentQuestion];
            progressEl.textContent = `Preguntita ${currentQuestion + 1} de ${questions.length}`;
            questionEl.textContent = q.question;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.textContent = opt;
                btn.onclick = () => selectOption(idx);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            const q = questions[currentQuestion];
            const buttons = optionsEl.querySelectorAll('.btn-option');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('correct');
                }
                if (idx === selectedIndex && selectedIndex !== q.correct) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedIndex === q.correct) {
                score++;
                const randomMsg = correctReactions[Math.floor(Math.random() * correctReactions.length)];
                reactionTitle.textContent = randomMsg;
                reactionTitle.style.color = "#059669";
            } else {
                const randomMsg = incorrectReactions[Math.floor(Math.random() * incorrectReactions.length)];
                reactionTitle.textContent = randomMsg;
                reactionTitle.style.color = "#e11d48";
            }

            explanationBody.textContent = q.explanation;
            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreText.textContent = `Puntaje final de mi reina: ${score} de ${questions.length} correctas. ¡Eres la más inteligente del mundo! 💕👑`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
