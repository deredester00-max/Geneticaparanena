<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro Ultra Rápido por Gestos</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    .container {
      position: relative;
      display: inline-block;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    video { display: none; }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #00ffcc;
      font-weight: bold;
    }
  </style>

  <!-- MediaPipe Hands Optimizado -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h2>Filtro de Mano Ultra Rápido</h2>
  <div class="container">
    <video id="webcam" playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>
  <div class="status" id="status">Filtro: Escala de Grises (Haz un recuadro con tus dedos)</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    // Lista de filtros
    const filters = [
      { name: 'Escala de Grises', style: 'grayscale(100%)' },
      { name: 'Sepia', style: 'sepia(100%)' },
      { name: 'Cyberpunk', style: 'hue-rotate(280deg) saturate(200%)' },
      { name: 'Invertido / Neón', style: 'invert(100%)' },
      { name: 'B&N Dramático', style: 'grayscale(100%) contrast(250%)' }
    ];
    let filterIndex = 0;
    let handLandmarks = [];
    let lastAngle = 0;
    let canSwitchFilter = true;

    // Configuración ultra optimizada de MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0, // 0 = Modo súper veloz sin lag
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
      handLandmarks = results.multiHandLandmarks || [];
    });

    // Iniciar cámara con tamaño ajustado para rendimiento
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
        render();
      },
      width: 480,
      height: 360
    });
    camera.start();

    // Ordenar 4 puntos geométricamente en sentido horario para que nunca se cruce el recuadro
    function sortPointsClockwise(pts) {
      const center = pts.reduce((acc, p) => ({ x: acc.x + p.x / pts.length, y: acc.y + p.y / pts.length }), { x: 0, y: 0 });
      return pts.slice().sort((a, b) => {
        const a1 = (Math.atan2(a.y - center.y, a.x - center.x) * 180 / Math.PI + 360) % 360;
        const a2 = (Math.atan2(b.y - center.y, b.x - center.x) * 180 / Math.PI + 360) % 360;
        return a1 - a2;
      });
    }

    function render() {
      canvas.width = video.videoWidth || 480;
      canvas.height = video.videoHeight || 360;

      // 1. Dibujar imagen a color normal de fondo
      ctx.filter = 'none';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      let rawPoints = [];

      // 2. Extraer los 4 dedos (Índices y Pulgares de ambas manos)
      if (handLandmarks.length >= 2) {
        // Mano 1: Pulgar (4), Índice (8)
        rawPoints.push({ x: handLandmarks[0][4].x * canvas.width, y: handLandmarks[0][4].y * canvas.height });
        rawPoints.push({ x: handLandmarks[0][8].x * canvas.width, y: handLandmarks[0][8].y * canvas.height });

        // Mano 2: Pulgar (4), Índice (8)
        rawPoints.push({ x: handLandmarks[1][4].x * canvas.width, y: handLandmarks[1][4].y * canvas.height });
        rawPoints.push({ x: handLandmarks[1][8].x * canvas.width, y: handLandmarks[1][8].y * canvas.height });

        // Detectar inclinación/rotación de la línea entre los dos índices para cambiar de filtro
        const dx = rawPoints[3].x - rawPoints[1].x;
        const dy = rawPoints[3].y - rawPoints[1].y;
        const currentAngle = Math.atan2(dy, dx) * (180 / Math.PI);

        if (Math.abs(currentAngle - lastAngle) > 25 && canSwitchFilter) {
          filterIndex = (filterIndex + 1) % filters.length;
          statusEl.innerText = `Filtro: ${filters[filterIndex].name}`;
          canSwitchFilter = false;
          setTimeout(() => { canSwitchFilter = true; }, 800);
        }
        lastAngle = currentAngle;
      }

      // 3. Dibujar el filtro dentro del recuadro ajustado
      if (rawPoints.length === 4) {
        // Ordenar esquinas para evitar deformaciones
        const sortedPts = sortPointsClockwise(rawPoints);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(sortedPts[0].x, sortedPts[0].y);
        ctx.lineTo(sortedPts[1].x, sortedPts[1].y);
        ctx.lineTo(sortedPts[2].x, sortedPts[2].y);
        ctx.lineTo(sortedPts[3].x, sortedPts[3].y);
        ctx.closePath();

        // Aplicar el filtro únicamente dentro del recuadro recortado
        ctx.clip();
        ctx.filter = filters[filterIndex].style;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Dibujar borde verde neón en las 4 esquinas
        ctx.beginPath();
        ctx.moveTo(sortedPts[0].x, sortedPts[0].y);
        for (let i = 1; i < sortedPts.length; i++) {
          ctx.lineTo(sortedPts[i].x, sortedPts[i].y);
        }
        ctx.closePath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dibujar puntos indicadores en las puntas
        sortedPts.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = '#00ffcc';
          ctx.fill();
        });
      }
    }
  </script>
</body>
</html>
