<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro Dinámico por Gestos</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    .container {
      position: relative;
      display: inline-block;
      border-radius: 16px;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    video { display: none; }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #00ffcc;
    }
  </style>

  <!-- MediaPipe Hands & Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <h2>Marco de Filtro Dinámico</h2>
  <div class="container">
    <video id="webcam" playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>
  <div class="status" id="status">Inclina la cabeza a los lados para cambiar de filtro</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    // Filtros disponibles
    const filters = [
      { name: 'Escala de Grises', style: 'grayscale(100%)' },
      { name: 'Sepia', style: 'sepia(100%)' },
      { name: 'Cyberpunk', style: 'hue-rotate(280deg) saturate(200%)' },
      { name: 'Invertido / Neón', style: 'invert(100%)' },
      { name: 'B&N Dramático', style: 'grayscale(100%) contrast(250%)' }
    ];
    let filterIndex = 0;
    let handLandmarks = [];
    let headTiltAngle = 0;
    let canChangeFilter = true;

    // 1. Configurar MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });
    hands.onResults(results => { handLandmarks = results.multiHandLandmarks || []; });

    // 2. Configurar MediaPipe FaceMesh (para inclinación de cabeza)
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false });
    faceMesh.onResults(results => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        // Puntos de los ojos (ojo izquierdo: 33, ojo derecho: 263)
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];

        const deltaY = rightEye.y - leftEye.y;
        const deltaX = rightEye.x - leftEye.x;
        headTiltAngle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

        // Cambiar de filtro al inclinar la cabeza a la izquierda o derecha (> 15 grados)
        if (Math.abs(headTiltAngle) > 15 && canChangeFilter) {
          filterIndex = (filterIndex + 1) % filters.length;
          statusEl.innerText = `Filtro Activo: ${filters[filterIndex].name}`;
          canChangeFilter = false;
          setTimeout(() => { canChangeFilter = true; }, 1000); // Cooldown de 1 seg
        }
      }
    });

    // 3. Iniciar Cámara
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
        await faceMesh.send({ image: video });
        renderFrame();
      },
      width: 640,
      height: 480
    });
    camera.start();

    // 4. Dibujar en Canvas
    function renderFrame() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      // A) Dibujar video a color base (fuera del recuadro)
      ctx.filter = 'none';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // B) Obtener las 4 puntas de los dedos si hay 2 manos detectadas
      let points = [];
      if (handLandmarks.length >= 2) {
        // Mano 1: Índice (8) y Pulgar (4)
        const h1_index = { x: handLandmarks[0][8].x * canvas.width, y: handLandmarks[0][8].y * canvas.height };
        const h1_thumb = { x: handLandmarks[0][4].x * canvas.width, y: handLandmarks[0][4].y * canvas.height };

        // Mano 2: Índice (8) y Pulgar (4)
        const h2_index = { x: handLandmarks[1][8].x * canvas.width, y: handLandmarks[1][8].y * canvas.height };
        const h2_thumb = { x: handLandmarks[1][4].x * canvas.width, y: handLandmarks[1][4].y * canvas.height };

        // Puntos ordenados formando un recuadro cerrado
        points = [h1_index, h1_thumb, h2_thumb, h2_index];
      }

      // C) Si están las 4 puntas de los dedos, recortar y aplicar el filtro
      if (points.length === 4) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[1].x, points[1].y);
        ctx.lineTo(points[2].x, points[2].y);
        ctx.lineTo(points[3].x, points[3].y);
        ctx.closePath();

        // Recortar canvas para que el filtro SOLO exista dentro de las 4 puntas
        ctx.clip();
        ctx.filter = filters[filterIndex].style;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // D) Dibujar bordes conectados entre las 4 puntas de los dedos
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.closePath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dibujar pequeños círculos en las 4 puntas de los dedos
        points.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
          ctx.fillStyle = '#00ffcc';
          ctx.fill();
        });
      }
    }
  </script>
</body>
</html>
