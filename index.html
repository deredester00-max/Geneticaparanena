<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Embriología Holográfica 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #38bdf8;
    }

    /* Video de la cámara 100% normal sin ningún filtro */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Modo espejo natural */
      z-index: 1;
    }

    /* Lienzo para los hologramas 3D interactivos */
    #hologramCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Panel UI de Control Futurista */
    .hud-panel {
      position: absolute;
      right: 15px;
      top: 20px;
      width: 260px;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid #0284c7;
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
      z-index: 3;
    }

    .hud-title {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7dd3fc;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .hud-btn {
      width: 100%;
      background: rgba(2, 132, 199, 0.1);
      border: 1px solid #38bdf8;
      color: #e0f2fe;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-btn:hover, .hud-btn.active {
      background: rgba(56, 189, 248, 0.35);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transform: translateX(-3px);
    }

    /* Cuadro Informativo Inferior */
    .hud-info {
      position: absolute;
      left: 15px;
      bottom: 20px;
      background: rgba(10, 15, 30, 0.85);
      border-left: 3px solid #38bdf8;
      padding: 10px 14px;
      font-size: 12px;
      color: #e0f2fe;
      z-index: 3;
      max-width: 320px;
      border-radius: 0 8px 8px 0;
      backdrop-filter: blur(8px);
    }

    .instructions {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.5);
      color: #38bdf8;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 6px;
      z-index: 3;
    }

    @media (max-width: 768px) {
      .hud-panel {
        top: auto;
        bottom: 15px;
        right: 15px;
        width: 220px;
      }
      .hud-info { display: none; }
    }
  </style>

  <!-- Motores 3D y Control de Cámara -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Cámara en vivo normal -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Lienzo de Hologramas 3D -->
  <canvas id="hologramCanvas"></canvas>

  <div class="instructions">🖱️ Toca y arrastra para girar / zoom en 3D</div>

  <!-- Menú Estilo Star Wars -->
  <div class="hud-panel">
    <div class="hud-title">EMBRIOLOGÍA 3D</div>
    <button class="hud-btn active" onclick="loadStage(1, this)">
      1. Fecundación <span>DÍA 1</span>
    </button>
    <button class="hud-btn" onclick="loadStage(2, this)">
      2. Mórula <span>DÍA 4</span>
    </button>
    <button class="hud-btn" onclick="loadStage(3, this)">
      3. Blastocisto <span>DÍA 7</span>
    </button>
    <button class="hud-btn" onclick="loadStage(4, this)">
      4. Embrión Humano <span>SEM 6</span>
    </button>
  </div>

  <div class="hud-info" id="infoBox">
    <strong>ETAPA 1: FECUNDACIÓN (ZIGOTO)</strong><br>
    Unión del óvulo y el espermatozoide. Se muestra el núcleo rodeado de la zona pelúcida.
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hologramCanvas');
    const infoBox = document.getElementById('infoBox');

    // 1. Iniciar cámara limpia sin filtros
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
        });
        video.srcObject = stream;
      } catch (e) {
        console.error("Error al cargar la cámara", e);
      }
    }
    startCamera();

    // 2. Escena 3D con Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Permitir rotación, zoom y desplazamiento 3D libre con dedos o ratón
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    camera.position.set(1.5, 0, 3.5); // Posicionar a la derecha para dar espacio al rostro

    // Material Holográfico
    const holoMaterial = new THREE.MeshBasicMaterial({
      color: 0x00f3ff,
      wireframe: true,
      transparent: true,
      opacity: 0.75
    });

    const innerMaterial = new THREE.MeshBasicMaterial({
      color: 0xff0088,
      wireframe: true,
      transparent: true,
      opacity: 0.85
    });

    let currentGroup = new THREE.Group();
    scene.add(currentGroup);

    // 3. Modelos 3D Detallados
    function buildZygote() {
      const group = new THREE.Group();
      // Zona Pelúcida (Exterior)
      const outer = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 24), holoMaterial);
      group.add(outer);
      // Pronúcleo (Interior)
      const core1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), innerMaterial);
      core1.position.set(-0.2, 0, 0);
      const core2 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), innerMaterial);
      core2.position.set(0.25, 0.1, 0);
      group.add(core1);
      group.add(core2);
      return group;
    }

    function buildMorula() {
      const group = new THREE.Group();
      const numCells = 16;
      for (let i = 0; i < numCells; i++) {
        const cell = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), holoMaterial);
        const phi = Math.acos(-1 + (2 * i) / numCells);
        const theta = Math.sqrt(numCells * Math.PI) * phi;
        cell.position.setFromSphericalCoords(0.65, phi, theta);
        group.add(cell);
      }
      return group;
    }

    function buildBlastocyst() {
      const group = new THREE.Group();
      // Trofoblasto (Capa externa)
      const outer = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 24), holoMaterial);
      group.add(outer);
      // Embrioblasto (Masa celular interna acumulada a un lado)
      const innerGroup = new THREE.Group();
      for(let i=0; i<8; i++){
        const cell = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), innerMaterial);
        cell.position.set(-0.6 + (Math.random()*0.3), -0.2 + (Math.random()*0.3), (Math.random()*0.3)-0.15);
        innerGroup.add(cell);
      }
      group.add(innerGroup);
      return group;
    }

    function buildEmbryo() {
      const group = new THREE.Group();
      
      // Estructura C-curvada del embrión
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.9, 0),
        new THREE.Vector3(-0.5, 0.5, 0),
        new THREE.Vector3(-0.4, -0.3, 0),
        new THREE.Vector3(0.2, -0.8, 0)
      ]);
      const body = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.28, 12, false), holoMaterial);
      group.add(body);

      // Cabeza prominente
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 16), holoMaterial);
      head.position.set(0, 0.9, 0);
      group.add(head);

      // Saco vitelino (Estructura circular inferior)
      const yolk = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), innerMaterial);
      yolk.position.set(0.2, -0.1, 0);
      group.add(yolk);

      // Salientes de extremidades (Brotación de brazos y piernas)
      const arm = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), innerMaterial);
      arm.position.set(-0.35, 0.2, 0.2);
      group.add(arm);

      return group;
    }

    // Cargar primera etapa por defecto
    let activeModel = buildZygote();
    currentGroup.add(activeModel);

    // 4. Cambiar etapas al presionar botones
    window.loadStage = function(stage, btn) {
      document.querySelectorAll('.hud-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentGroup.remove(activeModel);

      if (stage === 1) {
        activeModel = buildZygote();
        infoBox.innerHTML = "<strong>ETAPA 1: FECUNDACIÓN (ZIGOTO)</strong><br>Unión del óvulo y el espermatozoide. Se muestra el núcleo rodeado de la zona pelúcida.";
      } else if (stage === 2) {
        activeModel = buildMorula();
        infoBox.innerHTML = "<strong>ETAPA 2: MÓRULA</strong><br>Masa de 16 blastómeros compactados formando una estructura tipo mora.";
      } else if (stage === 3) {
        activeModel = buildBlastocyst();
        infoBox.innerHTML = "<strong>ETAPA 3: BLASTOCISTO</strong><br>Formación del trofoblasto (capa exterior) y la masa celular interna.";
      } else if (stage === 4) {
        activeModel = buildEmbryo();
        infoBox.innerHTML = "<strong>ETAPA 4: EMBRIÓN (SEM 6)</strong><br>Curvatura en 'C' con saco vitelino, formación de cabeza y primordios de miembros.";
      }

      currentGroup.add(activeModel);
    };

    // 5. Renderizado constante y rotación holográfica
    function animate() {
      requestAnimationFrame(animate);

      // Rotación suave del holograma
      if (currentGroup) {
        currentGroup.rotation.y += 0.005;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
