<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz para mi Amor Bonito 🍑💖</title>
    <style>
        :root {
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --text-color: #831843;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --correct-color: #10b981;
            --incorrect-color: #f43f5e;
            --border-color: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#f472b6 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 4px solid #f9a8d4;
            border-radius: 35px;
            max-width: 650px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 20px 35px rgba(236, 72, 153, 0.25);
            text-align: center;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 3px dashed #fbcfe8;
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .progress {
            font-size: 0.95rem;
            color: #be185d;
            font-weight: bold;
        }

        .question-container {
            background-color: #fff1f2;
            border-radius: 25px;
            padding: 22px;
            margin-bottom: 20px;
            border: 3px solid #fecdd3;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            color: #9f1239;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        /* Botones afelpados estilo 'cachetito' */
        .btn-option {
            background-color: #fff;
            border: 3px solid #fbcfe8;
            color: #831843;
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px #f9a8d4;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--accent-color);
            background-color: #fdf2f8;
            transform: translateY(-3px);
            box-shadow: 0 9px 0px #f472b6;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 3px 0px #f472b6;
        }

        .btn-option.correct {
            border-color: var(--correct-color);
            background-color: #d1fae5;
            color: #065f46;
            box-shadow: 0 6px 0px #34d399;
        }

        .btn-option.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffe4e6;
            color: #9f1239;
            box-shadow: 0 6px 0px #fb7185;
        }

        .feedback-card {
            display: none;
            padding: 18px;
            border-radius: 25px;
            background-color: #fdf2f8;
            border: 3px solid #fbcfe8;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #831843;
        }

        .reaction-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0px #be185d;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #9d174d;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0px #9d174d;
        }

        .result-screen {
            display: none;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .result-screen p {
            font-size: 1.2rem;
            color: #9f1239;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🍑 Repaso para mi Amor Bonito 💖</h1>
            <div id="progress" class="progress">Pregunta 1 de 30</div>
        </header>

        <main id="quiz-screen">
            <div class="question-container">
                <div id="question" class="question-text">Cargando la pregunta para mi reina...</div>
            </div>
            <div id="options" class="options-grid"></div>
            <div id="feedback" class="feedback-card">
                <div id="reaction-title" class="reaction-header"></div>
                <div id="explanation-body"></div>
            </div>
            <button id="next-btn" class="action-btn" style="display: none;">Siguiente Preguntita 💕</button>
        </main>

        <section id="result-screen" class="result-screen">
            <h2>¡Lo lograste mi reina hermosa! 🎉🔥</h2>
            <p id="score-text"></p>
            <button onclick="restartQuiz()" class="action-btn">Volver a jugar mi vida 🔄</button>
        </section>
    </div>

    <script>

            },
            {

                correct: 0,
                correctMsg: "¡Cuello de botella! Excelente mi amor bonito, ven que te mamaré esa pepa por lista 😈🔥",

            },
            {
                question: "¿Qué constituyen la mayor parte del genoma humano no codificante (aproximadamente el 45-50%)?",
                options: ["Genes ribosomales", "Elementos transponibles (transposones)", "Promotores básicos", "Exones primarios"],
                correct: 1,
                correctMsg: "¡Eso mi cielo! Transposones como los brincos que vamos a dar al rato 🙈💖",
                incorrectMsg: "¡Epa mi reina! Esa no era, respira hondo y dale a la otra 💕",
                explanation: "Los transposones o elementos móviles representan casi la mitad de nuestro ADN."
            },
            {
                question: "¿Cómo se llama al conjunto de regiones no codificantes que son removidas durante el Splicing?",
                options: ["Exones", "Intrones", "Cromómeros", "Centrómeros"],
                correct: 1,
                correctMsg: "¡Intrones! Perfecta mi amor bonito, qué bien te ves estudiando e inteligente 👑💖",
                incorrectMsg: "¡Ay mi vida te me cruzaste! No te preocupes mi niña, sigue intentando 🌸",

            },
            {
                question: "¿Qué representa la similitud genómica del 50% con plantas como el plátano?",
                options: ["Proteínas estructurales idénticas", "Vías metabólicas y celulares básicas de eucariotas", "Sistemas vasculares", "Paredes celulares"],
                correct: 1,
                correctMsg: "¡Eso mi reina! Muy bien contestado, esas nalgas merecen un aplauso 👏🍑",
                incorrectMsg: "¡Qué le paja ombe! Ponete seria mi amor que tú te sabes esto de memoria 🔥",

            },
            {
                question: "¿Qué variación de una sola base nitrogenada es la fuente más abundante de diferencias entre dos personas?",

                correct: 1,
                correctMsg: "¡Los SNPs! Tan única e inteligente como tú, mi amor bonito 😍✨",

            },
            {

                correct: 1,
                correctMsg: "¡Centrómero! Exacto mi cielo, ven pa agarrarte esos cachetitos hermosos 😚💖",

            },
            {
                question: "¿Cuál es la función principal de los telómeros?",
                options: ["Codificar enzimas", "Proteger contra la degradación y acortamiento del ADN", "Unir cromosomas", "Sintetizar ribosomas"],
                correct: 1,
                correctMsg: "¡Proteger el ADN! Como yo te protejo y te cuido a ti mi reina hermosa 👑💕",
                incorrectMsg: "¡No no no mi amor! Concéntrese que si no no hay premio al rato 😜🔥",
                explanation: "Protegen las puntas del cromosoma para no perder información vital."
            },
            {
                question: "¿Cuántos genes codificantes de proteínas se estima que tenemos en el genoma humano?",
                options: ["100,000 - 150,000", "20,000 - 25,000", "5,000 - 10,000", "1,000,000"],
                correct: 1,
                correctMsg: "¡De 20,000 a 25,000! Qué bárbara mi amor, te voy a manosear todita por lista 🍑🔥",
                incorrectMsg: "¡Uy te pasaste de números mi cielo! Revisa bien mi amor bonito 🌸",
                explanation: "Tenemos solo entre 20,000 y 25,000 genes codificantes."
            },
            {
                question: "¿Qué tipo de ARN lleva la información del ADN a los ribosomas?",
                options: ["ARNm (mensajero)", "ARNt", "ARNr", "ARNsn"],
                correct: 0,
                correctMsg: "¡El Mensajero! El mismo mensaje que te mando: Te Amo y estás bien buena 😍💖",
                incorrectMsg: "¡Qué le pasa ombe! Lee bien las opciones mi amorcito bello 💕",
                explanation: "El ARNm lleva el mensaje del núcleo al citoplasma."
            },
            {
                question: "¿Cómo se le llama a las secuencias altamente repetidas puestas una al lado de la otra?",
                options: ["Repeticiones en tándem", "Retrotransposones", "Exones alternativos", "Pseudo-genes"],
                correct: 0,
                correctMsg: "¡En tándem! Pegaditas una tras otra, como te quiero pegar a mí ahorita 😈🔥",
                incorrectMsg: "¡Epa mi reina te me chispoteaste! Vuelve a leer mi cielo 💕",
                explanation: "Las repeticiones en tándem están pegaditas una tras otra en el ADN."
            },
            {
                question: "¿Qué enzima sintetiza la nueva cadena de ADN en la replicación?",
                options: ["ARN Polimerasa", "ADN Polimerasa", "Helicasa", "Ligasa"],
                correct: 1,
                correctMsg: "¡ADN Polimerasa! Bella, inteligente y con unas nalgas hermosas, lo tienes todo 🍑✨",
                incorrectMsg: "¡Uy marica esa no es! Concéntrate mi niña consentida 🤣💖",
                explanation: "La ADN Polimerasa se encarga de ir copiando la hebra de ADN."
            },
            {
                question: "¿Qué proceso permite obtener varias proteínas distintas a partir de un mismo gen?",
                options: ["Splicing alternativo", "Mutación puntual", "Replicación", "Traducción"],
                correct: 0,
                correctMsg: "¡Splicing alternativo! Uff te la sabes perfecta mi amor bonito, te amo 💕👑",
                incorrectMsg: "¡Ay mi vida! Esa no era, pero te perdono porque estás bien hermosa 😍",
                explanation: "El Splicing alternativo combina exones de formas distintas para crear varias proteínas."
            },
            {
                question: "¿Qué porcentaje del genoma humano corresponde a secuencias únicas (no repetitivas)?",
                options: ["10%", "Cerca del 50%", "99%", "0.5%"],
                correct: 1,
                correctMsg: "¡Cerca del 50%! Como el 100% de mi corazón que es todo tuyo mi reina 💖✨",
                incorrectMsg: "¡Qué le paja ombe! Ponte atenta mi reina que ya falta poquito 🔥",
                explanation: "Aproximadamente el 50% de nuestro genoma son secuencias únicas."
            },
            {
                question: "¿Qué enzima evita el acortamiento de las puntas cromosómicas en células germinales?",
                options: ["Telomerasa", "Topoisomerasa", "Primasa", "Cinetocoras"],
                correct: 0,
                correctMsg: "¡Telomerasa! Ven acá pa darte un besote en la boca y una agarrada de nalgas 💋🍑",
                incorrectMsg: "¡Epa mi cielo te confundiste! Dale con calma mi amor bonito 💕",
                explanation: "La telomerasa alarga y mantiene protegidos los telómeros."
            },
            {
                question: "¿Cómo se llama la variación estructural donde se ganan o pierden trozos grandes de ADN?",
                options: ["CNV (Variación en número de copias)", "SNV", "Polimorfismo silencioso", "Transición"],
                correct: 0,
                correctMsg: "¡Las CNV! Estás hecha una dura en biología mi amor bonito 🧠🔥",
                incorrectMsg: "¡No no no mi vida! Revisa bien esa respuesta 🌸",
                explanation: "Las CNVs son duplicaciones o deleciones de más de 1,000 bases."
            },
            {
                question: "¿Cómo se le llama al proceso de síntesis de proteínas a partir del ARNm?",
                options: ["Transcripción", "Traducción", "Splicing", "Replicación"],
                correct: 1,
                correctMsg: "¡Traducción! Te traduzco lo que siento: Te mamaré esa pepa bien sabroso 😈🔥",
                incorrectMsg: "¡Uy te me despistaste! Dale a la siguiente mi vida hermosa 💕",
                explanation: "La traducción lee el código del ARNm para construir la proteína."
            },
            {
                question: "¿De quién heredamos el ADN mitocondrial prácticamente en un 100%?",
                options: ["Del papá", "De la mamá", "De ambos por igual", "De los abuelos paternos"],
                correct: 1,
                correctMsg: "¡De la mamá! Mami hermosa eres tú, te amo mi amor bonito 😍💖",
                incorrectMsg: "¡Qué le pasa ombe! Esa la sabe cualquiera mi cielo, concéntrate 🤣💕",

            {
                question: "¿Qué transposones se mueven usando un molde de ARN intermediario?",
                options: ["Retrotransposones", "Transposones de ADN", "Plásmidos", "Bacteriófagos"],
                correct: 0,
                correctMsg: "¡Retrotransposones! Mi niña inteligente, me das un orgullo enorme 👑✨",
                incorrectMsg: "¡Ay mi reina esa no era! Tranquila que te sigo amando igual 💖",

            {
                question: "¿Qué elementos repetidos representan casi el 10% de todo nuestro genoma?",
                options: ["Elementos Alu", "LINE-1", "HERV", "Microsatélites"],
                correct: 0,
                correctMsg: "¡Elementos Alu! Eso es, te ganaste mil besos en esos cachetitos hermosos 😚💋",
                incorrectMsg: "¡Epa mi vida te me caíste ahí! Lee con cuidado 💕",

            {
                question: "¿Cómo se llama la cromatina súper compactada e inactiva?",
                options: ["Eucromatina", "Heterocromatina", "Nucleosoma", "Promotor"],
                correct: 1,
                correctMsg: "¡Heterocromatina! Súper apretada como la nalgada que te voy a dar ahorita 🍑😈",
                incorrectMsg: "¡Uy marica esa no era! Dale mi amorcito que tú puedes con todas 🤣💖",
                explanation: "La heterocromatina está muy apretada y casi no se transcribe."
            },
            {
                question: "¿Cuál es la unidad básica de empaquetamiento del ADN formada por 8 histonas?",
                options: ["Nucleosoma", "Centrómero", "Cinetocoro", "Polimerasa"],
                correct: 0,
                correctMsg: "¡Nucleosoma! Redondito como tus cachetitos que me encantan 😍🌸",
                incorrectMsg: "¡Qué le paja ombe! Piénsale bien mi reina bella 🔥",
                explanation: "El nucleosoma es la 'bolita' sobre la que se enrolla el ADN."
            },
            {
                question: "¿Qué prueba analiza solamente el 1.6% codificante del ADN para buscar enfermedades?",
                options: ["Secuenciación del Exoma Completo (WES)", "WGS", "Kariotipo", "PCR"],
                correct: 0,
                correctMsg: "¡El Exoma Completo (WES)! Estás a nivel profesional mi amor bonito 🧠💖",
                incorrectMsg: "¡Epa mi cielo no te rindas! Ya casi terminamos 💕",
                explanation: "WES busca directo en el exoma para ver si hay mutaciones en proteínas."
            },
            {
                question: "¿Qué herramienta evolutiva usa la tasa de mutación constante para medir tiempo entre especies?",
                options: ["Reloj Molecular", "Selección Natural", "Splicing", "Apareamiento"],
                correct: 0,
                correctMsg: "¡Reloj Molecular! ¡Terminaste mi reina! Eres la más inteligente y la más buena del mundo 👑🍑🔥",
                incorrectMsg: "¡Uy casi mi amor! Pero completaste el examen, eres la mejor mi vida 💖",
                explanation: "El reloj molecular calcula cuándo se separaron dos especies evolutivamente."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const reactionTitle = document.getElementById('reaction-title');
        const explanationBody = document.getElementById('explanation-body');
        const nextBtn = document.getElementById('next-btn');
        const progressEl = document.getElementById('progress');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const scoreText = document.getElementById('score-text');

        function loadQuestion() {
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';
            optionsEl.innerHTML = '';

            const q = questions[currentQuestion];
            progressEl.textContent = `Preguntita ${currentQuestion + 1} de ${questions.length}`;
            questionEl.textContent = q.question;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.textContent = opt;
                btn.onclick = () => selectOption(idx);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            const q = questions[currentQuestion];
            const buttons = optionsEl.querySelectorAll('.btn-option');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('correct');
                }
                if (idx === selectedIndex && selectedIndex !== q.correct) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedIndex === q.correct) {
                score++;
                reactionTitle.textContent = q.correctMsg;
                reactionTitle.style.color = "#059669";
            } else {
                reactionTitle.textContent = q.incorrectMsg;
                reactionTitle.style.color = "#e11d48";
            }

            explanationBody.textContent = q.explanation;
            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreText.textContent = `Puntaje final de mi amor bonito: ${score} de ${questions.length} correctas. ¡Te ganaste todas las sobadas de nalgas y los besitos del mundo! 🍑💖🔥`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
